<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Управління студентами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .search-container {
            margin-bottom: 20px;
        }
        .form-container {
            margin-bottom: 30px;
        }
        .table-container {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Управління студентами</h2>
        
        <!-- Повідомлення про помилку -->
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <span th:text="${error}"></span>
        </div>
        
        <!-- Повідомлення про успіх -->
        <div th:if="${message}" class="alert alert-success" role="alert">
            <span th:text="${message}"></span>
        </div>

        <!-- Форма пошуку -->
        <div class="search-container">
            <form th:action="@{/students/search}" method="get" class="row g-3">
                <div class="col-auto">
                    <input type="number" name="id" class="form-control" placeholder="Введіть ID студента">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Пошук</button>
                </div>
                <div class="col-auto">
                    <a th:href="@{/students}" class="btn btn-secondary">Показати всіх</a>
                </div>
            </form>
        </div>

        <!-- Форма додавання/редагування -->
        <div class="form-container">
            <h3 th:text="${student.id == null ? 'Додати нового студента' : 'Редагувати студента'}"></h3>
            <form th:action="@{/students}" th:object="${student}" method="post">
                <input type="hidden" th:field="*{id}">
                <div class="mb-3">
                    <label for="name" class="form-label">Ім'я</label>
                    <input type="text" class="form-control" id="name" th:field="*{name}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="age" class="form-label">Вік</label>
                    <input type="number" class="form-control" id="age" th:field="*{age}" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                </div>
                <button type="submit" class="btn btn-primary">Зберегти</button>
                <a th:href="@{/students}" class="btn btn-secondary">Скасувати</a>
            </form>
        </div>

        <!-- Форма фільтрації за віком -->
        <div class="search-container">
            <form th:action="@{/students/filter}" method="get" class="row g-3">
                <div class="col-auto">
                    <input type="number" name="age" class="form-control" placeholder="Введіть мінімальний вік" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-info">Фільтрувати за віком</button>
                </div>
            </form>
        </div>

        <!-- Таблиця студентів -->
        <div class="table-container">
            <h3>Список студентів</h3>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Ім'я</th>
                        <th>Вік</th>
                        <th>Дії</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td th:text="${student.id}"></td>
                        <td th:text="${student.name}"></td>
                        <td th:text="${student.age}"></td>
                        <td>
                            <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-sm btn-warning">Редагувати</a>
                            <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                               class="btn btn-sm btn-danger"
                               onclick="return confirm('Ви впевнені, що хочете видалити цього студента?')">Видалити</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
