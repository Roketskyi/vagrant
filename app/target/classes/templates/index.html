<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .student-card {
            transition: transform 0.2s;
        }
        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }
        .action-buttons {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1 class="text-center mb-0">Student Management System</h1>
            <p class="text-center mb-0">Manage your students efficiently</p>
        </div>
    </div>

    <div class="container">
        <div class="row mb-4">
            <div class="col">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search students...">
                    <button class="btn btn-outline-secondary" type="button">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row" id="studentList">
            <div th:each="student : ${students}" class="col-md-4 mb-4">
                <div class="card student-card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${student.name}">Student Name</h5>
                        <p class="card-text">
                            <i class="fas fa-user-graduate me-2"></i>
                            <span th:text="${student.age}">Age</span> years old
                        </p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                <i class="fas fa-id-card me-1"></i>
                                ID: <span th:text="${student.id}">ID</span>
                            </small>
                            <div class="btn-group">
                                <button class="btn btn-sm btn-outline-primary" th:onclick="'editStudent(' + ${student.id} + ')'">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-outline-danger" th:onclick="'deleteStudent(' + ${student.id} + ')'">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-primary rounded-circle" onclick="showAddStudentModal()">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- Add/Edit Student Modal -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Add New Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <div class="mb-3">
                            <label for="studentName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="studentName" required>
                        </div>
                        <div class="mb-3">
                            <label for="studentAge" class="form-label">Age</label>
                            <input type="number" class="form-control" id="studentAge" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveStudent()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let studentModal;
        let currentStudentId = null;

        document.addEventListener('DOMContentLoaded', function() {
            studentModal = new bootstrap.Modal(document.getElementById('studentModal'));
            
            // Search functionality
            document.getElementById('searchInput').addEventListener('input', function(e) {
                const searchText = e.target.value.toLowerCase();
                const cards = document.querySelectorAll('.student-card');
                
                cards.forEach(card => {
                    const name = card.querySelector('.card-title').textContent.toLowerCase();
                    const age = card.querySelector('.card-text').textContent.toLowerCase();
                    
                    if (name.includes(searchText) || age.includes(searchText)) {
                        card.closest('.col-md-4').style.display = '';
                    } else {
                        card.closest('.col-md-4').style.display = 'none';
                    }
                });
            });
        });

        function showAddStudentModal() {
            currentStudentId = null;
            document.getElementById('modalTitle').textContent = 'Add New Student';
            document.getElementById('studentForm').reset();
            studentModal.show();
        }

        function editStudent(id) {
            currentStudentId = id;
            document.getElementById('modalTitle').textContent = 'Edit Student';
            // Fetch student data and populate form
            fetch(`/api/students/${id}`)
                .then(response => response.json())
                .then(student => {
                    document.getElementById('studentName').value = student.name;
                    document.getElementById('studentAge').value = student.age;
                    studentModal.show();
                });
        }

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                fetch(`/api/students/${id}`, {
                    method: 'DELETE'
                }).then(() => {
                    location.reload();
                });
            }
        }

        function saveStudent() {
            const student = {
                name: document.getElementById('studentName').value,
                age: parseInt(document.getElementById('studentAge').value)
            };

            const url = currentStudentId 
                ? `/api/students/${currentStudentId}`
                : '/api/students';
            
            const method = currentStudentId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(student)
            }).then(() => {
                studentModal.hide();
                location.reload();
            });
        }
    </script>
</body>
</html>
