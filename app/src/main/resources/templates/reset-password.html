<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f5f5;
            --text-color: #333;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        body {
            background-color: var(--secondary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-password-container {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
        }

        .card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            padding: 2rem;
        }

        .card-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .icon {
            font-size: 3rem;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .title {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            margin-bottom: 1rem;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .btn-reset {
            background-color: var(--primary-color);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 1.5rem;
            font-weight: 500;
            width: 100%;
            color: white;
            margin-bottom: 1rem;
        }

        .btn-reset:hover {
            background-color: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .password-requirements {
            font-size: 0.9rem;
            color: #666;
            margin-top: 1rem;
            padding: 1rem;
            background-color: #f8f9fa;
            border-radius: 10px;
        }

        .requirement {
            margin-bottom: 0.5rem;
        }

        .requirement i {
            width: 20px;
            color: var(--primary-color);
        }

        .alert {
            border-radius: 10px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="reset-password-container">
        <div class="card">
            <div class="card-header">
                <div class="icon">
                    <i class="fas fa-lock"></i>
                </div>
                <h1 class="title">Reset Password</h1>
                <p class="subtitle">Enter your new password</p>
            </div>

            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-2"></i>
                <span th:text="${error}"></span>
            </div>

            <form th:action="@{/reset-password}" method="post" id="resetForm">
                <input type="hidden" name="token" th:value="${token}">
                
                <div class="mb-3">
                    <input type="password" class="form-control" name="password" id="password"
                           placeholder="New password" required minlength="8">
                </div>
                
                <div class="mb-3">
                    <input type="password" class="form-control" id="confirmPassword"
                           placeholder="Confirm new password" required>
                </div>

                <div class="password-requirements">
                    <div class="requirement">
                        <i class="fas fa-check-circle"></i> At least 8 characters
                    </div>
                    <div class="requirement">
                        <i class="fas fa-check-circle"></i> Contains uppercase letter
                    </div>
                    <div class="requirement">
                        <i class="fas fa-check-circle"></i> Contains lowercase letter
                    </div>
                    <div class="requirement">
                        <i class="fas fa-check-circle"></i> Contains number
                    </div>
                    <div class="requirement">
                        <i class="fas fa-check-circle"></i> Contains special character
                    </div>
                </div>

                <button type="submit" class="btn btn-reset mt-3">
                    <i class="fas fa-key me-2"></i>Reset Password
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', function(e) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Passwords do not match!');
                return;
            }

            const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
            if (!passwordRegex.test(password)) {
                e.preventDefault();
                alert('Password does not meet requirements!');
                return;
            }
        });

        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const requirements = document.querySelectorAll('.requirement i');

            requirements[0].className = password.length >= 8 ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger';
            requirements[1].className = /[A-Z]/.test(password) ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger';
            requirements[2].className = /[a-z]/.test(password) ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger';
            requirements[3].className = /\d/.test(password) ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger';
            requirements[4].className = /[@$!%*?&]/.test(password) ? 'fas fa-check-circle text-success' : 'fas fa-times-circle text-danger';
        });
    </script>
</body>
</html>
