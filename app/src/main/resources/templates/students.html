<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f5f5;
            --accent-color: #ff6b6b;
            --text-color: #333;
            --card-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --transition-speed: 0.3s;
        }

        body {
            background-color: var(--secondary-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text-color);
        }

        .navbar {
            background-color: white;
            box-shadow: var(--card-shadow);
            padding: 1rem 2rem;
        }

        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
            font-size: 1.5rem;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .page-title {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .search-container {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        .search-input {
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            transition: all var(--transition-speed);
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .student-card {
            background: white;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .student-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        .student-card .card-body {
            padding: 1.5rem;
        }

        .student-card .card-title {
            color: var(--primary-color);
            font-weight: bold;
            margin-bottom: 1rem;
            font-size: 1.25rem;
        }

        .student-card .card-text {
            color: #666;
            margin-bottom: 1.5rem;
        }

        .student-info {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .student-info i {
            width: 20px;
            color: var(--primary-color);
            margin-right: 0.5rem;
        }

        .btn-edit, .btn-delete {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 500;
            transition: all var(--transition-speed);
        }

        .btn-edit {
            background-color: var(--primary-color);
            border: none;
            margin-right: 0.5rem;
        }

        .btn-edit:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        .btn-delete {
            background-color: var(--accent-color);
            border: none;
        }

        .btn-delete:hover {
            background-color: #e05555;
            transform: translateY(-2px);
        }

        .floating-button {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-speed);
            font-size: 1.5rem;
        }

        .floating-button:hover {
            background-color: #357abd;
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        .alert {
            border-radius: 10px;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            display: none;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content {
            border-radius: 15px;
            border: none;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            background-color: var(--primary-color);
            color: white;
            border-radius: 15px 15px 0 0;
            padding: 1.5rem;
        }

        .modal-title {
            font-weight: bold;
        }

        .modal-body {
            padding: 2rem;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-color);
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 2px solid #e0e0e0;
            transition: all var(--transition-speed);
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(74, 144, 226, 0.25);
        }

        .modal-footer {
            border-top: none;
            padding: 1.5rem;
        }

        .btn-secondary {
            background-color: #6c757d;
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1.5rem;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            border-radius: 20px;
            padding: 0.5rem 1.5rem;
        }

        .btn-secondary:hover, .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn-logout {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all var(--transition-speed);
        }

        .btn-logout:hover {
            background-color: #e05555;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="/home">
                <i class="fas fa-graduation-cap me-2"></i>
                Student Management
            </a>
            <div class="d-flex align-items-center">
                <span class="me-3" sec:authentication="name"></span>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-logout">
                        <i class="fas fa-sign-out-alt me-2"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Student Management System</h1>
        
        <div class="search-container">
            <div class="input-group">
                <span class="input-group-text bg-white border-0">
                    <i class="fas fa-search text-muted"></i>
                </span>
                <input type="text" class="form-control search-input" id="searchInput" placeholder="Search students...">
            </div>
        </div>

        <div class="alert alert-danger" id="errorAlert" role="alert"></div>
        <div class="alert alert-success" id="successAlert" role="alert"></div>

        <div class="row" id="studentsList">
            <div class="col-md-4" th:each="student : ${students}">
                <div class="card student-card">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${student.name}">Student Name</h5>
                        <div class="student-info">
                            <i class="fas fa-user"></i>
                            <span>Age: <span th:text="${student.age}">Age</span></span>
                        </div>
                        <div class="student-info">
                            <i class="fas fa-star"></i>
                            <span>Grade: <span th:text="${student.grade}">Grade</span></span>
                        </div>
                        <div class="student-info">
                            <i class="fas fa-id-card"></i>
                            <span>ID: <span th:text="${student.id}">ID</span></span>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-edit edit-btn" th:data-id="${student.id}" th:data-name="${student.name}" th:data-age="${student.age}" th:data-grade="${student.grade}" sec:authorize="hasRole('ADMIN')">
                                <i class="fas fa-edit me-2"></i>Edit
                            </button>
                            <button class="btn btn-delete delete-btn" th:data-id="${student.id}" sec:authorize="hasRole('ADMIN')">
                                <i class="fas fa-trash me-2"></i>Delete
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button class="floating-button" id="addStudentBtn" sec:authorize="hasRole('ADMIN')">
            <i class="fas fa-plus"></i>
        </button>
    </div>

    <!-- Add/Edit Student Modal -->
    <div class="modal fade" id="studentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Add/Edit Student</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <div class="mb-4">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="name" required>
                        </div>
                        <div class="mb-4">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" class="form-control" id="age" required min="16" max="100">
                        </div>
                        <div class="mb-4">
                            <label for="grade" class="form-label">Grade</label>
                            <input type="number" class="form-control" id="grade" required min="0" max="100" step="0.1">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveStudentBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Change User Roles Modal -->
    <div class="modal fade" id="roleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Change User Roles</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="roleForm">
                        <input type="hidden" id="userId">
                        <div class="mb-3">
                            <label for="roles" class="form-label">Roles</label>
                            <select multiple class="form-control" id="roles">
                                <option value="ROLE_USER">ROLE_USER</option>
                                <option value="ROLE_ADMIN">ROLE_ADMIN</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveRoles()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Get CSRF token from meta tag
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        // Function to show alert
        function showAlert(message, type) {
            const alertDiv = document.getElementById(type === 'error' ? 'errorAlert' : 'successAlert');
            alertDiv.textContent = message;
            alertDiv.style.display = 'block';
            setTimeout(() => {
                alertDiv.style.display = 'none';
            }, 3000);
        }

        // Function to load students
        function loadStudents() {
            fetch('/api/students')
                .then(response => response.json())
                .then(students => {
                    const studentsList = document.getElementById('studentsList');
                    studentsList.innerHTML = students.map(student => `
                        <div class="col-md-4">
                            <div class="card student-card">
                                <div class="card-body">
                                    <h5 class="card-title">${student.name}</h5>
                                    <div class="student-info">
                                        <i class="fas fa-user"></i>
                                        <span>Age: ${student.age}</span>
                                    </div>
                                    <div class="student-info">
                                        <i class="fas fa-star"></i>
                                        <span>Grade: ${student.grade}</span>
                                    </div>
                                    <div class="student-info">
                                        <i class="fas fa-id-card"></i>
                                        <span>ID: ${student.id}</span>
                                    </div>
                                    <div class="mt-3">
                                        <button class="btn btn-edit edit-btn" data-id="${student.id}" data-name="${student.name}" data-age="${student.age}" data-grade="${student.grade}" sec:authorize="hasRole('ADMIN')">
                                            <i class="fas fa-edit me-2"></i>Edit
                                        </button>
                                        <button class="btn btn-delete delete-btn" data-id="${student.id}" sec:authorize="hasRole('ADMIN')">
                                            <i class="fas fa-trash me-2"></i>Delete
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `).join('');

                    // Add event listeners to buttons
                    document.querySelectorAll('.edit-btn').forEach(btn => {
                        btn.addEventListener('click', () => editStudent(btn.dataset.id));
                    });
                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', () => deleteStudent(btn.dataset.id));
                    });
                })
                .catch(error => {
                    console.error('Error loading students:', error);
                    showAlert('Error loading students', 'error');
                });
        }

        // Function to save student
        function saveStudent() {
            const studentId = document.getElementById('studentId').value;
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            const grade = document.getElementById('grade').value;

            const studentData = {
                name: name,
                age: parseInt(age),
                grade: parseFloat(grade)
            };

            const url = studentId ? `/api/students/${studentId}` : '/api/students';
            const method = studentId ? 'PUT' : 'POST';

            fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(studentData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.json().then(err => {
                        throw new Error(err.message || 'Error saving student');
                    });
                }
                return response.json();
            })
            .then(() => {
                loadStudents();
                bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide();
                showAlert(`Student ${studentId ? 'updated' : 'added'} successfully`, 'success');
            })
            .catch(error => {
                console.error('Error saving student:', error);
                showAlert(error.message || 'Error saving student', 'error');
            });
        }

        // Function to edit student
        function editStudent(id) {
            fetch(`/api/students/${id}`)
                .then(response => response.json())
                .then(student => {
                    document.getElementById('studentId').value = student.id;
                    document.getElementById('name').value = student.name;
                    document.getElementById('age').value = student.age;
                    document.getElementById('grade').value = student.grade;
                    const modal = new bootstrap.Modal(document.getElementById('studentModal'));
                    modal.show();
                })
                .catch(error => {
                    console.error('Error loading student:', error);
                    showAlert('Error loading student', 'error');
                });
        }

        // Function to delete student
        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                fetch(`/api/students/${id}`, {
                    method: 'DELETE',
                    headers: {
                        [csrfHeader]: csrfToken
                    }
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    loadStudents();
                    showAlert('Student deleted successfully', 'success');
                })
                .catch(error => {
                    console.error('Error deleting student:', error);
                    showAlert('Error deleting student', 'error');
                });
            }
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchText = e.target.value.toLowerCase();
            document.querySelectorAll('.student-card').forEach(card => {
                const name = card.querySelector('.card-title').textContent.toLowerCase();
                const age = card.querySelector('.student-info').textContent.toLowerCase();
                if (name.includes(searchText) || age.includes(searchText)) {
                    card.closest('.col-md-4').style.display = '';
                } else {
                    card.closest('.col-md-4').style.display = 'none';
                }
            });
        });

        // Event listeners
        document.getElementById('addStudentBtn').addEventListener('click', () => {
            document.getElementById('studentId').value = '';
            document.getElementById('name').value = '';
            document.getElementById('age').value = '';
            document.getElementById('grade').value = '';
            const modal = new bootstrap.Modal(document.getElementById('studentModal'));
            modal.show();
        });

        document.getElementById('saveStudentBtn').addEventListener('click', saveStudent);

        // Load students on page load
        loadStudents();

        function openRoleModal(userId) {
            document.getElementById('userId').value = userId;
            const modal = new bootstrap.Modal(document.getElementById('roleModal'));
            modal.show();
        }

        function saveRoles() {
            const userId = document.getElementById('userId').value;
            const selectedRoles = Array.from(document.getElementById('roles').selectedOptions).map(option => option.value);

            fetch(`/api/users/${userId}/roles`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    [csrfHeader]: csrfToken
                },
                body: JSON.stringify(selectedRoles)
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error updating roles');
                }
                return response.json();
            })
            .then(() => {
                showAlert('Roles updated successfully', 'success');
                bootstrap.Modal.getInstance(document.getElementById('roleModal')).hide();
            })
            .catch(error => {
                console.error('Error updating roles:', error);
                showAlert('Error updating roles', 'error');
            });
        }
    </script>
</body>
</html>
